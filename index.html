<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Photobooth</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
#v{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#v.m{transform:scaleX(-1)}
#st{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:clamp(90px,17vmin,150px);aspect-ratio:1;border:0;padding:0;background:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));transition:transform .12s}
#st:active{transform:translateX(-50%) scale(.92)}
#st svg{width:100%;height:100%}
#cd{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:46vmin;font-weight:800;color:#fff;text-shadow:0 0 40px rgba(232,116,154,.9),0 6px 30px rgba(0,0,0,.45);pointer-events:none}
#cd.p{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}30%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:.9}}
#fl{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#fl.on{animation:fl .5s ease-out}
@keyframes fl{from{opacity:.95}to{opacity:0}}
.ib{position:fixed;top:max(12px,env(safe-area-inset-top));width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;font-size:20px;backdrop-filter:blur(6px)}
#cfg{right:12px}#fs{right:64px}
#q{position:fixed;left:12px;bottom:max(14px,env(safe-area-inset-bottom));color:#fff;font-size:12px;text-shadow:0 1px 4px #000}
#ts{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translate(-50%,-80px);max-width:80vw;padding:8px 14px;border-radius:20px;background:rgba(30,20,26,.85);color:#fff;font-size:13px;transition:transform .3s}
#ts.on{transform:translate(-50%,0)}
#pn{position:fixed;inset:0;background:rgba(20,12,16,.72);display:flex;align-items:center;justify-content:center;padding:14px}
#pn[hidden]{display:none}
.cd{width:100%;max-width:460px;max-height:92vh;overflow:auto;background:#fff7fa;color:#3b2a32;border-radius:22px;padding:18px}
.cd h2{margin:0 0 10px;font-size:1.2rem}
.cd h3{margin:14px 0 6px;font-size:.95rem}
.cd select,.cd input[type=text]{width:100%;padding:10px;border:1px solid #efd3dc;border-radius:10px;font:1rem system-ui}
.cd button{width:100%;margin-top:8px;padding:12px;border:0;border-radius:12px;background:#d9567f;color:#fff;font:600 1rem system-ui}
.cd label{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;margin-top:8px}
.cd input[type=range]{width:100%;accent-color:#d9567f}
.cd small{color:#8a6f7a;display:block;margin-top:4px}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<div id="cd"></div><div id="fl"></div>
<button class="ib" id="fs" aria-label="Tela cheia">⛶</button>
<button class="ib" id="cfg" aria-label="Configurações">⚙</button>
<div id="q"></div><div id="ts"></div>
<button id="st" aria-label="Tirar foto">
<svg viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8fb3"/><stop offset="1" stop-color="#ffc58a"/></linearGradient></defs>
<path d="M50 8l12.6 27 29.4 3.6-21.7 20.3 5.7 29.1L50 73.6 24 88l5.7-29.1L8 38.6 37.4 35z" fill="url(#g)" stroke="url(#g)" stroke-width="9" stroke-linejoin="round"/>
<path d="M50 8l12.6 27 29.4 3.6-21.7 20.3 5.7 29.1L50 73.6 24 88l5.7-29.1L8 38.6 37.4 35z" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="3" stroke-linejoin="round"/></svg>
</button>

<div id="pn"><div class="cd">
<h2>Configuração do Photobooth</h2>
<h3>Câmera</h3><select id="cam"></select>
<label><span><input type="checkbox" id="es"> Espelhar a prévia</span></label>
<h3>Impressora PD01</h3>
<button id="bi">Conectar impressora</button><small id="si">Feche o Fun Print antes. Toque a cada vez que abrir o aplicativo.</small>
<label>Intensidade (energia)</label><input type="range" id="en" min="4000" max="30000" step="500">
<label>Contraste</label><input type="range" id="ct" min="0.6" max="2.4" step="0.1">
<label>Papel extra no fim</label><input type="range" id="fd" min="0" max="300" step="10">
<label><span><input type="checkbox" id="gi"> Girar fotos horizontais 90°</span></label>
<h3>Google Drive</h3>
<input type="text" id="cid" placeholder="Client ID do Google (OAuth)">
<input type="text" id="pa" placeholder="Nome da pasta" style="margin-top:8px">
<button id="bg">Conectar Google Drive</button><small id="sg">Sem Client ID, as fotos ficam guardadas no aparelho.</small>
<button id="ok" style="margin-top:16px">Começar</button>
</div></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const $ = id => document.getElementById(id);
const esperar = ms => new Promise(r => setTimeout(r, ms));
const cl = v => Math.max(0, Math.min(255, v));
const cfg = Object.assign({ cam: '', cid: '', pasta: 'Photobooth', fid: '', en: 12000, fd: 128, ct: 1.2, girar: false, esp: true }, (() => { try { return JSON.parse(localStorage.pb || '{}'); } catch (e) { return {}; } })());
const salvar = () => { try { localStorage.pb = JSON.stringify(cfg); } catch (e) {} };
function aviso(m) { const t = $('ts'); t.textContent = m; t.classList.add('on'); clearTimeout(aviso.t); aviso.t = setTimeout(() => t.classList.remove('on'), 4500); }
const exec = f => async () => { try { await f(); } catch (e) { aviso(e.message); } };

/* ---------- Câmera ---------- */
let stream;
async function camera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: cfg.cam ? { exact: cfg.cam } : undefined, facingMode: cfg.cam ? undefined : 'user', width: { ideal: 4096 }, height: { ideal: 3072 } }, audio: false });
  $('v').srcObject = stream; await $('v').play();
  const ds = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  $('cam').innerHTML = ds.map((d, i) => '<option value="' + d.deviceId + '">' + (d.label || 'Câmera ' + (i + 1)) + '</option>').join('');
  $('cam').value = stream.getVideoTracks()[0].getSettings().deviceId || '';
}
const espelho = () => $('v').classList.toggle('m', cfg.esp);

/* ---------- Fila local (IndexedDB) para o Google Drive ---------- */
const db = new Promise((ok, er) => { const r = indexedDB.open('pb', 1); r.onupgradeneeded = () => r.result.createObjectStore('fila', { keyPath: 'id' }); r.onsuccess = () => ok(r.result); r.onerror = () => er(r.error); });
const op = async (m, f) => { const d = await db; return new Promise((ok, er) => { const t = d.transaction('fila', m), r = f(t.objectStore('fila')); t.oncomplete = () => ok(r.result); t.onerror = () => er(t.error); }); };
const guardar = o => op('readwrite', s => s.put(o));
const remover = id => op('readwrite', s => s.delete(id));
const todos = () => op('readonly', s => s.getAll());
async function atualizarFila() {
  const n = cfg.cid ? (await todos()).length : 0, p = fila.length;
  $('q').textContent = (n || p) ? 'Drive: ' + n + '   Impressão: ' + p : '';
}

/* ---------- Google Drive (OAuth 2.0, escopo drive.file) ---------- */
let token = '', expira = 0;
function pedirToken() {
  return new Promise((ok, er) => {
    if (!window.google || !google.accounts) return er(new Error('Biblioteca do Google indisponível (sem internet?)'));
    if (!cfg.cid) return er(new Error('Informe o Client ID do Google'));
    google.accounts.oauth2.initTokenClient({
      client_id: cfg.cid, scope: 'https://www.googleapis.com/auth/drive.file',
      callback: r => { if (r.error) return er(new Error('Google: ' + r.error)); token = r.access_token; expira = Date.now() + (r.expires_in - 120) * 1000; ok(token); },
      error_callback: e => er(new Error('Google: ' + (e.type || 'erro')))
    }).requestAccessToken({ prompt: '' });
  });
}
const obterToken = async () => Date.now() < expira ? token : pedirToken();
async function jf(u, o) { const r = await fetch(u, o); if (!r.ok) throw new Error('Drive erro ' + r.status); return r.json(); }
async function pastaId() {
  if (cfg.fid) return cfg.fid;
  const h = { Authorization: 'Bearer ' + await obterToken() };
  const q = encodeURIComponent("name='" + cfg.pasta.replace(/'/g, "\\'") + "' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  const r = await jf('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id)', { headers: h });
  let id = r.files && r.files[0] && r.files[0].id;
  if (!id) id = (await jf('https://www.googleapis.com/drive/v3/files?fields=id', { method: 'POST', headers: { ...h, 'Content-Type': 'application/json' }, body: JSON.stringify({ name: cfg.pasta, mimeType: 'application/vnd.google-apps.folder' }) })).id;
  cfg.fid = id; salvar(); return id;
}
async function enviarDrive(it) {
  const t = await obterToken(), parent = await pastaId(), f = new FormData();
  f.append('metadata', new Blob([JSON.stringify({ name: it.nome, parents: [parent] })], { type: 'application/json' }));
  f.append('file', it.blob);
  await jf('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { Authorization: 'Bearer ' + t }, body: f });
}
let drvOn = false, drvErro = '';
async function rodarDrive() {
  if (drvOn || !cfg.cid) return; drvOn = true;
  try {
    for (const it of await todos()) {
      if (!navigator.onLine) break;
      try { await enviarDrive(it); await remover(it.id); drvErro = ''; }
      catch (e) { if (drvErro !== e.message) aviso('Drive: ' + e.message + '. Foto guardada, nova tentativa em breve.'); drvErro = e.message; break; }
    }
  } finally { drvOn = false; atualizarFila(); }
}

/* ---------- Impressora PD01 (BLE, serviço 0xAE30) ---------- */
const W = 384, T = new Uint8Array(256);
for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = (c & 128) ? ((c << 1) ^ 7) & 255 : (c << 1) & 255; T[i] = c; }
const pkt = (cmd, d = []) => Uint8Array.from([0x51, 0x78, cmd, 0, d.length & 255, d.length >> 8, ...d, d.reduce((c, b) => T[c ^ b], 0), 0xFF]);
let dev, car, pausado = false, espera = [], chunk = 128;

async function ligar() {
  const sv = await (await dev.gatt.connect()).getPrimaryService(0xAE30);
  car = await sv.getCharacteristic(0xAE01);
  const rx = await sv.getCharacteristic(0xAE02);
  await rx.startNotifications();
  rx.addEventListener('characteristicvaluechanged', e => {
    const dv = e.target.value, v = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
    if (v[2] === 0xAE) { pausado = v[6] === 0x10; if (!pausado) espera.splice(0).forEach(f => f()); }
  });
}
async function pedirImpressora() {
  if (!navigator.bluetooth) throw new Error('Este navegador não tem Web Bluetooth. Use o Chrome.');
  dev = await navigator.bluetooth.requestDevice({ filters: [{ services: [0xAF30] }, { namePrefix: 'PD01' }], optionalServices: [0xAE30] });
  dev.addEventListener('gattserverdisconnected', () => { car = null; aviso('Impressora desconectada. Tentando reconectar...'); });
  await ligar();
}
async function enviar(b) {
  for (let i = 0; i < b.length;) {
    if (pausado) { await new Promise(r => { espera.push(r); setTimeout(r, 3000); }); pausado = false; }
    try { await car.writeValueWithoutResponse(b.subarray(i, i + chunk)); i += chunk; await esperar(6); }
    catch (e) { if (chunk > 20) chunk = 20; else throw e; }
  }
}
function reduzir(s) {
  let c = s;
  while (c.width >= W * 2) { const n = document.createElement('canvas'); n.width = c.width >> 1; n.height = c.height >> 1; const x = n.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(c, 0, 0, n.width, n.height); c = n; }
  const f = document.createElement('canvas'); f.width = W; f.height = Math.max(1, Math.round(c.height * W / c.width));
  const x = f.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, f.height); x.imageSmoothingQuality = 'high'; x.drawImage(c, 0, 0, W, f.height);
  return f;
}
/* Configuração inicial aprovada: contraste, Floyd-Steinberg, 384 px */
function linhas(src) {
  let s = src;
  if (cfg.girar && src.width > src.height) { s = document.createElement('canvas'); s.width = src.height; s.height = src.width; const x = s.getContext('2d'); x.translate(src.height, 0); x.rotate(Math.PI / 2); x.drawImage(src, 0, 0); }
  const f = reduzir(s), H = f.height, d = f.getContext('2d').getImageData(0, 0, W, H).data, g = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) g[i] = cl((0.299 * d[4 * i] + 0.587 * d[4 * i + 1] + 0.114 * d[4 * i + 2] - 128) * cfg.ct + 128);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, o = g[i], v = o < 128 ? 0 : 255, e = o - v; g[i] = v;
    if (x + 1 < W) g[i + 1] += e * 7 / 16;
    if (y + 1 < H) { if (x > 0) g[i + W - 1] += e * 3 / 16; g[i + W] += e * 5 / 16; if (x + 1 < W) g[i + W + 1] += e / 16; }
  }
  const rows = [];
  for (let y = 0; y < H; y++) { const r = new Array(48).fill(0); for (let x = 0; x < W; x++) if (g[y * W + x] === 0) r[x >> 3] |= 1 << (x & 7); rows.push(r); }
  return rows;
}
async function imprimirBlob(blob) {
  const rows = linhas(await createImageBitmap(blob)), en = cfg.en, fd = cfg.fd;
  const P = [pkt(0xA3, [0]), pkt(0xA4, [0x32]), pkt(0xBD, [32]), pkt(0xAF, [en & 255, en >> 8]), pkt(0xBE, [1]), pkt(0xA9, [0]), pkt(0xA6, [0xAA, 0x55, 0x17, 0x38, 0x44, 0x5F, 0x5F, 0x5F, 0x44, 0x38, 0x2C])];
  rows.forEach(r => P.push(pkt(0xA2, r)));
  P.push(pkt(0xA6, [0xAA, 0x55, 0x17, 0, 0, 0, 0, 0, 0, 0, 0x17]), pkt(0xBD, [8]), pkt(0xA1, [fd & 255, fd >> 8]), pkt(0xA3, [0]));
  const all = new Uint8Array(P.reduce((n, p) => n + p.length, 0)); let o = 0; P.forEach(p => { all.set(p, o); o += p.length; });
  await enviar(all);
}
/* Fila de impressão: uma foto por vez, até 3 tentativas por rodada */
const fila = []; let imprOn = false;
async function rodarImpressao() {
  if (imprOn) return; imprOn = true;
  try {
    while (fila.length) {
      if (!dev) { aviso('Conecte a impressora nas configurações.'); break; }
      const it = fila[0];
      try { if (!car || !dev.gatt.connected) await ligar(); await imprimirBlob(it.blob); fila.shift(); atualizarFila(); await esperar(2500); }
      catch (e) { it.t = (it.t || 0) + 1; if (it.t >= 3) { aviso('Impressora: ' + e.message + '. Nova tentativa em instantes.'); it.t = 0; break; } await esperar(3000); }
    }
  } finally { imprOn = false; atualizarFila(); }
}

/* ---------- Captura ---------- */
const stamp = () => { const d = new Date(), p = (n, l = 2) => String(n).padStart(l, '0'); return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + '_' + p(d.getMilliseconds(), 3); };
let ocupado = false;
async function foto() {
  if (ocupado || !stream) return; ocupado = true;
  try {
    for (let n = 3; n > 0; n--) { const e = $('cd'); e.textContent = n; e.classList.remove('p'); void e.offsetWidth; e.classList.add('p'); await esperar(1000); }
    $('cd').textContent = '';
    const v = $('v'), c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext('2d').drawImage(v, 0, 0);
    const f = $('fl'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.95)), nome = 'photobooth_' + stamp() + '.jpg';
    fila.push({ nome, blob });
    if (cfg.cid) await guardar({ id: nome, nome, blob });
    atualizarFila(); rodarImpressao(); rodarDrive();
  } catch (e) { aviso('Erro ao capturar: ' + e.message); }
  finally { ocupado = false; }
}

/* ---------- Interface ---------- */
$('cid').value = cfg.cid; $('pa').value = cfg.pasta; $('en').value = cfg.en; $('ct').value = cfg.ct; $('fd').value = cfg.fd; $('gi').checked = cfg.girar; $('es').checked = cfg.esp;
$('cid').onchange = () => { cfg.cid = $('cid').value.trim(); salvar(); };
$('pa').onchange = () => { cfg.pasta = $('pa').value.trim() || 'Photobooth'; cfg.fid = ''; salvar(); };
['en', 'ct', 'fd'].forEach(k => $(k).oninput = () => { cfg[k] = +$(k).value; salvar(); });
$('gi').onchange = () => { cfg.girar = $('gi').checked; salvar(); };
$('es').onchange = () => { cfg.esp = $('es').checked; salvar(); espelho(); };
$('cam').onchange = exec(async () => { cfg.cam = $('cam').value; salvar(); await camera(); });
$('bi').onclick = exec(async () => { await pedirImpressora(); $('si').textContent = 'Impressora conectada.'; rodarImpressao(); });
$('bg').onclick = exec(async () => { cfg.cid = $('cid').value.trim(); cfg.pasta = $('pa').value.trim() || 'Photobooth'; salvar(); await pastaId(); $('sg').textContent = 'Google Drive conectado. Pasta: ' + cfg.pasta; rodarDrive(); });
$('ok').onclick = () => { $('pn').hidden = true; };
$('cfg').onclick = () => { $('pn').hidden = false; };
$('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
$('st').onclick = foto;
addEventListener('keydown', e => { if (e.code === 'Space' && $('pn').hidden) { e.preventDefault(); foto(); } });
addEventListener('online', rodarDrive); setInterval(rodarDrive, 15000); setInterval(rodarImpressao, 20000);
const tela = () => { try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {} };
tela(); document.addEventListener('visibilitychange', () => { if (!document.hidden) tela(); });
espelho(); camera().catch(e => aviso('Câmera: ' + e.message)); atualizarFila();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
