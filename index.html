<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste da impressora PD01</title>
<style>
:root{--bg:#fff6f8;--fg:#3b2a32;--ac:#d9567f;--card:#ffffff;--bd:#efd3dc;--mut:#8a6f7a}
@media(prefers-color-scheme:dark){:root{--bg:#1c1317;--fg:#f4e6ec;--ac:#f08ab0;--card:#2a1d23;--bd:#47333d;--mut:#b99aa8}}
*{box-sizing:border-box}
body{margin:0 auto;padding:18px;max-width:520px;font:16px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
h1{font-size:1.35rem;margin:0 0 4px}
p{margin:0 0 14px;color:var(--mut)}
button,.file{display:block;width:100%;margin:0 0 10px;padding:14px;border:0;border-radius:14px;background:var(--ac);color:#fff;font:600 1rem system-ui,sans-serif;text-align:center}
button:disabled,.file.off{opacity:.4}
.file input{display:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:14px 0}
label.r{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;margin-top:8px}
input[type=range]{width:100%;accent-color:var(--ac)}
pre{height:190px;overflow:auto;margin:0;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--bd);font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap}
select{width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:1rem system-ui,sans-serif}
label.c{display:flex;gap:8px;align-items:center;font-size:.9rem;margin-top:10px}
</style>
</head>
<body>
<h1>Teste da impressora PD01</h1>
<p>Use o Chrome no Android e feche o Fun Print antes de conectar.</p>

<button id="bc">Conectar impressora</button>
<button id="bt" disabled>Imprimir padrão de teste</button>
<label class="file off" id="fl">Imprimir uma foto<input type="file" id="fi" accept="image/*" disabled></label>

<div class="card">
  <label class="r">Intensidade (energia) <b id="enV"></b></label>
  <input type="range" id="en" min="4000" max="30000" step="500" value="12000">
  <label class="r">Velocidade <b id="spV"></b></label>
  <input type="range" id="sp" min="4" max="64" step="1" value="32">
  <label class="r">Papel extra no fim <b id="fdV"></b></label>
  <input type="range" id="fd" min="0" max="300" step="10" value="128">
  <label class="r">Contraste da foto <b id="ctV"></b></label>
  <input type="range" id="ct" min="0.6" max="2.4" step="0.1" value="1.2">
  <label class="r">Brilho da foto <b id="brV"></b></label>
  <input type="range" id="br" min="-60" max="60" step="5" value="0">
  <label class="r">Nitidez <b id="ntV"></b></label>
  <input type="range" id="nt" min="0" max="1.5" step="0.1" value="0.6">
  <label class="r">Clarear tons médios (gama) <b id="gmV"></b></label>
  <input type="range" id="gm" min="0.6" max="1.3" step="0.05" value="0.9">
  <label class="r">Método de pontilhado</label>
  <select id="alg"><option value="fs">Floyd-Steinberg serpentina</option><option value="atk">Atkinson</option><option value="bayer">Ordenado (Bayer 8x8)</option><option value="jjn">Jarvis-Judice-Ninke</option></select>
  <label class="c"><input type="checkbox" id="gi" checked> Girar fotos horizontais 90° (mais resolução)</label>
  <label class="c"><input type="checkbox" id="au" checked> Ajuste automático de níveis</label>
  <label class="r">Ao escolher a foto</label>
  <select id="md"><option value="foto">Imprimir a foto</option><option value="cmp">Imprimir comparação dos 4 métodos</option></select>
</div>

<pre id="log"></pre>

<script>
const $ = id => document.getElementById(id);
const log = m => { const l = $('log'); l.textContent += m + '\n'; l.scrollTop = 1e9; };
const hex = v => [...v].map(b => b.toString(16).padStart(2, '0')).join(' ');

/* Sliders mostram o valor atual */
['en','sp','fd','ct','br','nt','gm'].forEach(k => {
  const up = () => $(k + 'V').textContent = $(k).value;
  $(k).addEventListener('input', up); up();
});

/* CRC8 (polinômio 0x07) e montagem de pacotes: 51 78 CMD 00 LEN_L LEN_H DADOS CRC FF */
const T = new Uint8Array(256);
for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = (c & 128) ? ((c << 1) ^ 7) & 255 : (c << 1) & 255; T[i] = c; }
const crc = d => d.reduce((c, b) => T[c ^ b], 0);
const pkt = (cmd, d = []) => Uint8Array.from([0x51, 0x78, cmd, 0, d.length & 255, d.length >> 8, ...d, crc(d), 0xFF]);

/* Bluetooth */
let tx = null, paused = false, waiters = [], chunk = 128, busy = false;

async function conectar() {
  if (!navigator.bluetooth) { log('Este navegador não tem Web Bluetooth. Use o Chrome no Android ou no Windows.'); return; }
  const dev = await navigator.bluetooth.requestDevice({
    filters: [{ services: [0xAF30] }, { namePrefix: 'PD01' }],
    optionalServices: [0xAE30]
  });
  dev.addEventListener('gattserverdisconnected', () => { tx = null; ui(false); log('Impressora desconectada.'); });
  const srv = await dev.gatt.connect();
  const svc = await srv.getPrimaryService(0xAE30);
  tx = await svc.getCharacteristic(0xAE01);
  const rx = await svc.getCharacteristic(0xAE02);
  await rx.startNotifications();
  rx.addEventListener('characteristicvaluechanged', e => {
    const dv = e.target.value, v = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
    log('Impressora: ' + hex(v));
    if (v[2] === 0xAE) { paused = v[6] === 0x10; if (!paused) waiters.splice(0).forEach(f => f()); }
  });
  ui(true);
  log('Conectada a ' + (dev.name || 'PD01') + '.');
}

function ui(on) {
  $('bt').disabled = !on; $('fi').disabled = !on;
  $('fl').classList.toggle('off', !on);
  $('bc').textContent = on ? 'Conectada (tocar para trocar)' : 'Conectar impressora';
}

async function enviar(bytes) {
  for (let i = 0; i < bytes.length;) {
    if (paused) { await new Promise(r => { waiters.push(r); setTimeout(r, 3000); }); paused = false; }
    try {
      await tx.writeValueWithoutResponse(bytes.subarray(i, i + chunk));
      i += chunk;
      await new Promise(r => setTimeout(r, 6));
    } catch (e) {
      if (chunk > 20) { chunk = 20; log('Blocos menores (20 bytes).'); } else throw e;
    }
  }
}

/* Processamento de imagem para papel térmico (384 px = 48 bytes por linha) */
const W = 384;
const K = {
  fs:  { d: 16, k: [[1,0,7],[-1,1,3],[0,1,5],[1,1,1]] },
  atk: { d: 8,  k: [[1,0,1],[2,0,1],[-1,1,1],[0,1,1],[1,1,1],[0,2,1]] },
  jjn: { d: 48, k: [[1,0,7],[2,0,5],[-2,1,3],[-1,1,5],[0,1,7],[1,1,5],[2,1,3],[-2,2,1],[-1,2,3],[0,2,5],[1,2,3],[2,2,1]] }
};
const cl = v => Math.max(0, Math.min(255, v));
const opcoes = (x = {}) => ({
  ct: +$('ct').value, br: +$('br').value, nit: +$('nt').value, gm: +$('gm').value,
  alg: $('alg').value, girar: $('gi').checked, auto: $('au').checked, ...x
});

function bayer(n) {
  let m = [[0]];
  while (m.length < n) {
    const s = m.length, r = [], q = [[0, 2], [3, 1]];
    for (let y = 0; y < 2 * s; y++) { r.push([]); for (let x = 0; x < 2 * s; x++) r[y].push(m[y % s][x % s] * 4 + q[(y / s) | 0][(x / s) | 0]); }
    m = r;
  }
  return m;
}

/* Redução em etapas com suavização de alta qualidade, até 384 px de largura */
function reduzir(s) {
  let c = s;
  while (c.width >= W * 2) {
    const n = document.createElement('canvas'); n.width = Math.floor(c.width / 2); n.height = Math.floor(c.height / 2);
    const x = n.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(c, 0, 0, n.width, n.height); c = n;
  }
  const f = document.createElement('canvas'); f.width = W; f.height = Math.max(1, Math.round(c.height * W / c.width));
  const x = f.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, f.height);
  x.imageSmoothingQuality = 'high'; x.drawImage(c, 0, 0, W, f.height);
  return f;
}

/* Cinza, níveis automáticos, nitidez, contraste/brilho e gama */
function preparar(src, o) {
  let s = src;
  if (o.girar && src.width > src.height) {
    s = document.createElement('canvas'); s.width = src.height; s.height = src.width;
    const x = s.getContext('2d'); x.translate(src.height, 0); x.rotate(Math.PI / 2); x.drawImage(src, 0, 0);
  }
  const f = reduzir(s), H = f.height, n = W * H;
  const d = f.getContext('2d').getImageData(0, 0, W, H).data, g = new Float32Array(n);
  for (let i = 0; i < n; i++) g[i] = 0.299 * d[4 * i] + 0.587 * d[4 * i + 1] + 0.114 * d[4 * i + 2];
  if (o.auto) {
    const h = new Uint32Array(256); for (let i = 0; i < n; i++) h[g[i] | 0]++;
    let a = 0, lo = 0, hi = 255;
    while (lo < 255 && (a += h[lo]) < n * 0.01) lo++;
    a = 0; while (hi > 0 && (a += h[hi]) < n * 0.01) hi--;
    if (hi - lo > 20) for (let i = 0; i < n; i++) g[i] = cl((g[i] - lo) * 255 / (hi - lo));
  }
  if (o.nit > 0) {
    const b = new Float32Array(n);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let t = 0;
      for (let j = -1; j <= 1; j++) { const yy = Math.min(H - 1, Math.max(0, y + j)); for (let i = -1; i <= 1; i++) t += g[yy * W + Math.min(W - 1, Math.max(0, x + i))]; }
      b[y * W + x] = t / 9;
    }
    for (let i = 0; i < n; i++) g[i] = cl(g[i] + o.nit * (g[i] - b[i]));
  }
  for (let i = 0; i < n; i++) g[i] = 255 * Math.pow(cl((g[i] - 128) * o.ct + 128 + o.br) / 255, o.gm);
  return { g, H };
}

/* Pontilhado: difusão de erro em serpentina ou ordenado. Deixa só 0 (preto) e 255 (branco) */
function pontilhar(g, H, alg) {
  if (alg === 'bayer') {
    const B = bayer(8);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) g[y * W + x] = g[y * W + x] < (B[y & 7][x & 7] + 0.5) * 255 / 64 ? 0 : 255;
    return;
  }
  const { d, k } = K[alg];
  for (let y = 0; y < H; y++) {
    const rev = y & 1;
    for (let t = 0; t < W; t++) {
      const x = rev ? W - 1 - t : t, i = y * W + x, o = g[i], v = o < 128 ? 0 : 255, e = o - v;
      g[i] = v;
      for (const [dx, dy, w] of k) {
        const xx = x + (rev ? -dx : dx), yy = y + dy;
        if (xx >= 0 && xx < W && yy < H) g[yy * W + xx] += e * w / d;
      }
    }
  }
}

/* Cada linha vira 48 bytes: pixel preto = 1, pixel mais à esquerda no bit menos significativo */
function empacotar(g, H) {
  const rows = [];
  for (let y = 0; y < H; y++) {
    const r = new Array(48).fill(0);
    for (let x = 0; x < W; x++) if (g[y * W + x] === 0) r[x >> 3] |= 1 << (x & 7);
    rows.push(r);
  }
  return rows;
}

async function imprimirLinhas(rows) {
  if (!tx) { log('Conecte a impressora primeiro.'); return; }
  if (busy) { log('Aguarde a impressão atual terminar.'); return; }
  busy = true;
  try {
    const en = +$('en').value, sp = +$('sp').value, fd = +$('fd').value;
    log('Enviando ' + rows.length + ' linhas...');
    const P = [
      pkt(0xA3, [0]), pkt(0xA4, [0x32]), pkt(0xBD, [sp]), pkt(0xAF, [en & 255, en >> 8]),
      pkt(0xBE, [1]), pkt(0xA9, [0]),
      pkt(0xA6, [0xAA, 0x55, 0x17, 0x38, 0x44, 0x5F, 0x5F, 0x5F, 0x44, 0x38, 0x2C])
    ];
    rows.forEach(r => P.push(pkt(0xA2, r)));
    P.push(pkt(0xA6, [0xAA, 0x55, 0x17, 0, 0, 0, 0, 0, 0, 0, 0x17]), pkt(0xBD, [8]), pkt(0xA1, [fd & 255, fd >> 8]), pkt(0xA3, [0]));
    const all = new Uint8Array(P.reduce((n, p) => n + p.length, 0));
    let o = 0; P.forEach(p => { all.set(p, o); o += p.length; });
    await enviar(all);
    log('Dados enviados. Aguarde a impressora terminar.');
  } finally { busy = false; }
}

async function imprimir(src, extra) {
  const o = opcoes(extra), { g, H } = preparar(src, o);
  pontilhar(g, H, o.alg);
  await imprimirLinhas(empacotar(g, H));
}

/* Folha de comparação: a mesma faixa central da foto com 4 métodos (1 a 4 riscos antes de cada faixa) */
async function comparar(src) {
  const o = opcoes(), { g, H } = preparar(src, o), h = Math.min(150, H), ini = (H - h) >> 1, rows = [];
  ['fs', 'atk', 'bayer', 'jjn'].forEach((alg, k) => {
    for (let j = 0; j <= k; j++) rows.push(new Array(48).fill(255), new Array(48).fill(255), ...[0, 1, 2].map(() => new Array(48).fill(0)));
    const b = g.slice(ini * W, (ini + h) * W); pontilhar(b, h, alg); rows.push(...empacotar(b, h));
  });
  log('Comparação: 1 risco = Floyd-Steinberg, 2 = Atkinson, 3 = Ordenado, 4 = Jarvis.');
  await imprimirLinhas(rows);
}

function padrao() {
  const c = document.createElement('canvas'); c.width = 384; c.height = 320;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, 384, 320);
  g.strokeStyle = '#000'; g.lineWidth = 4; g.strokeRect(2, 2, 380, 316);
  g.fillStyle = '#000'; g.font = 'bold 22px sans-serif'; g.fillText('TESTE PD01 - 384 px', 24, 44);
  const gr = g.createLinearGradient(24, 0, 360, 0); gr.addColorStop(0, '#000'); gr.addColorStop(1, '#fff');
  g.fillStyle = gr; g.fillRect(24, 64, 336, 56);
  for (let i = 0; i < 8; i++) { g.fillStyle = 'hsl(0,0%,' + (i * 13) + '%)'; g.fillRect(24 + i * 42, 134, 42, 40); }
  g.lineWidth = 1;
  for (let i = 0; i < 16; i++) { g.beginPath(); g.moveTo(24 + i * 21 + .5, 190); g.lineTo(24 + i * 21 + .5, 300); g.stroke(); }
  return c;
}

const run = f => async (...a) => { try { await f(...a); } catch (e) { log('Erro: ' + e.message); } };
$('bc').onclick = run(conectar);
$('bt').onclick = run(() => imprimir(padrao(), { girar: false, auto: false, nit: 0 }));
$('fi').onchange = run(async e => {
  const f = e.target.files[0];
  if (f) { const b = await createImageBitmap(f); await ($('md').value === 'cmp' ? comparar(b) : imprimir(b)); }
  e.target.value = '';
});
log('Pronto. Toque em "Conectar impressora".');
</script>
</body>
</html>
